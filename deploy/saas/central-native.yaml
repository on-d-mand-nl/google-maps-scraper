name: gmapssaas-central
services:
  migrate:
    image: gmapssaas:local
    command: [admin, migrate]
    environment:
      DATABASE_URL: postgres://gmapssaas:${POSTGRES_PASSWORD}@host.docker.internal:5433/gmapssaas?sslmode=disable
  server:
    image: gmapssaas:local
    restart: unless-stopped
    command: [serve]
    environment:
      DATABASE_URL: postgres://gmapssaas:${POSTGRES_PASSWORD}@host.docker.internal:5433/gmapssaas?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    ports:
      - "${DASHBOARD_IP:-127.0.0.1}:8090:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://localhost:8080/admin/login]
      interval: 30s
      timeout: 5s
      retries: 3
